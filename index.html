<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d katalog předmětů</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #222;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 40px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .header-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .header-text {
            text-align: left;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        header p {
            margin: 5px 0 0 0;
            color: #666;
            font-size: 14px;
        }

        .search-filter-section {
            max-width: 1200px;
            margin: 30px auto 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-wrapper {
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #333;
        }

        .filter-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: #333;
        }

        .filter-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        .catalog-grid {
            max-width: 1200px;
            margin: 30px auto 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .catalog-card {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #eaeaea;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .catalog-card:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        .card-viewer-container {
            height: 250px;
            background: #f0f0f0;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        .card-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-info h2 {
            margin: 0;
            font-size: 18px;
            color: #111;
        }

        .card-tag {
            align-self: flex-start;
            background: #e0e0e0;
            color: #444;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .card-meta {
            font-size: 13px;
            color: #777;
            margin: 5px 0 0 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <img src="logo.png" alt="Logo" class="header-logo">
            <div class="header-text">
                <h1>DIGITÁLNÍ SBÍRKY</h1>
                <p>3d katalog sbírkových předmětů</p>
            </div>
        </div>
    </header>

    <section class="search-filter-section">
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Vyhledat předmět (název, lokalita, inv. č., datace...)">
        </div>
        <div class="filter-wrapper">
            <button class="filter-btn active" data-filter="all">Vše</button>
            <button class="filter-btn" data-filter="archeologie">Archeologie</button>
            <button class="filter-btn" data-filter="historie">Historie</button>
            <button class="filter-btn" data-filter="etnografie">Etnografie a regionália</button>
            <button class="filter-btn" data-filter="prirodoveda">Přírodověda</button>
            <button class="filter-btn" data-filter="militaria">Militária</button>
        </div>
    </section>

    <main class="catalog-grid" id="catalogGrid">

        <a href="A50476.html" class="catalog-card" data-category="archeologie" data-name="Bronzová ataše" data-tag="Doba římská" data-meta="Lokalita: Boskovicko Inv. č.: A50476">
            <div class="card-viewer-container">
                <model-viewer 
                    src="A50476-web-glb.glb" 
                    poster="A50476-jpeg.jpg"
                    loading="lazy"
                    reveal="interaction"
                    interaction-prompt="none"
                    style="pointer-events: none;">
                </model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">Doba římská</span>
                <h2>Bronzová ataše</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: A50476</p>
            </div>
        </a>

        <a href="A56265.html" class="catalog-card" data-category="archeologie" data-name="Stříbrná spona" data-tag="Doba římská" data-meta="Lokalita: Boskovicko Inv. č.: A56265">
            <div class="card-viewer-container">
                <model-viewer 
                    src="A56265.glb" 
                    poster="1.jpg"
                    loading="lazy"
                    reveal="interaction"
                    interaction-prompt="none"
                    style="pointer-events: none;">
                </model-viewer>
            </div>
            <div class="card-info">
                <span class="card-tag">Doba římská</span>
                <h2>Stříbrná spona</h2>
                <p class="card-meta">Lokalita: Boskovicko<br>Inv. č.: A56265</p>
            </div>
        </a>

    </main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.catalog-card');

        let currentFilter = 'all';
        let searchText = '';

        function filterCatalog() {
            cards.forEach(card => {
                const category = card.getAttribute('data-category');
                const name = card.getAttribute('data-name').toLowerCase();
                const tag = card.getAttribute('data-tag').toLowerCase();
                const meta = card.getAttribute('data-meta').toLowerCase();
                
                const matchesFilter = (currentFilter === 'all' || category === currentFilter);
                const matchesSearch = (
                    name.includes(searchText) || 
                    tag.includes(searchText) || 
                    meta.includes(searchText)
                );

                if (matchesFilter && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            searchText = e.target.value.toLowerCase().trim();
            filterCatalog();
        });

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentFilter = button.getAttribute('data-filter');
                filterCatalog();
            });
        });
    </script>

</body>
</html>
