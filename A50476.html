<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail: Bronzová ataše</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; color: #333; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: #000; }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Levá strana: Média */
        .media-section { flex: 1 1 500px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Společný box pro 3D model i Foto */
        .model-box, .photo-wrapper { background: #e9e9e9; height: 450px; border-radius: 6px; overflow: hidden; position: relative; }
        model-viewer { width: 100%; height: 100%; }
        
        /* NOVÉ: Kontajner pro fotku s podporou plynulého zoomu */
        .photo-wrapper { display: none; cursor: grab; user-select: none; background: #f0f0f0; }
        .photo-wrapper:active { cursor: grabbing; }
        
        .main-photo-view { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transform-origin: 0 0; /* Důležité pro správný výpočet pozice zoomu */
            transition: transform 0.1s ease-out;
            pointer-events: none; /* Ignoruje přímé akce na obrázek, aby fungovalo tahání boxu */
        }
        
        .zoom-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; pointer-events: none; z-index: 10; }

        /* Galerie náhledů */
        .gallery { display: flex; gap: 10px; }
        .gallery-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
        .gallery-thumb:hover { border-color: #999; }

        /* Pravá strana: Informace */
        .info-section { flex: 1 1 400px; }
        h1 { margin-top: 0; font-size: 26px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td { padding: 12px 0; border-bottom: 1px solid #eee; }
        td.label { font-weight: bold; color: #666; width: 40%; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Zpět do katalogu</a>

    <div class="container">
        
        <div class="media-section">
            
            <div class="model-box" id="modelBox">
                <model-viewer 
                    id="atašeModel"
                    src="A50476-web-glb.glb" 
                    alt="Bronzová ataše"
                    camera-controls 
                    auto-rotate 
                    environment-image="neutral"
                    exposure="1.5"
                    shadow-intensity="0">
                </model-viewer>
            </div>

            <div id="photoWrapper" class="photo-wrapper">
                <img src="" id="mainPhoto" class="main-photo-view" alt="Detailní foto">
                <div class="zoom-hint">📜 Použijte kolečko myši pro zoom a tažení pro posun</div>
            </div>

            <div class="gallery">
                <div class="gallery-thumb" onclick="show3D()" style="background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-transform: uppercase;">3D</div>
                <img src="A50476-jpeg.jpg" class="gallery-thumb" onclick="changeMedia('A50476-jpeg.jpg')" alt="Náhled 1">
            </div>
            <p style="margin: 0; font-size: 12px; color: #888;">Kliknutím na "3D" se vrátíte k interaktivnímu modelu.</p>
        </div>

        <div class="info-section">
            <h1>Bronzová ataše</h1>
            <table>
                <tr><td class="label">Období</td><td>Doba římská</td></tr>
                <tr><td class="label">Lokalita</td><td>Boskovicko</td></tr>
                <tr><td class="label">Inv. č.</td><td>A50476</td></tr>
                <tr><td class="label">Materiál</td><td>Bronz</td></tr>
            </table>
        </div>

    </div>

    <script>
        // 1. OTOČENÍ MODELU: Hned po načtení ho skript otočí
        const model = document.getElementById('atašeModel');
        model.addEventListener('load', () => {
            model.orientation = "0deg 180deg 0deg";
        });

        // 2. PŘEPÍNÁNÍ MEZI 3D A FOTKAMI
        const modelBox = document.getElementById('modelBox');
        const photoWrapper = document.getElementById('photoWrapper');
        const mainPhoto = document.getElementById('mainPhoto');

        function changeMedia(photoUrl) {
            modelBox.style.display = 'none';
            photoWrapper.style.display = 'block'; 
            mainPhoto.src = photoUrl;
            resetZoom(); // Resetuje zoom při změně fotky
        }

        function show3D() {
            photoWrapper.style.display = 'none';
            modelBox.style.display = 'block';
        }

        // 3. SKRIPT PRO ZOOM KOLEČKEM MYŠI A TAHÁNÍ (Přímo v rámečku)
        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isPanning = false;

        function setTransform() {
            mainPhoto.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // Zoomování kolečkem myši
        photoWrapper.addEventListener('wheel', function(e) {
            e.preventDefault(); // Zabrání scrollování celé stránky při zoomu fotky
            
            const xs = (e.offsetX - pointX) / scale;
            const ys = (e.offsetY - pointY) / scale;
            const delta = -e.deltaY;

            if (delta > 0) {
                scale *= 1.2;
            } else {
                scale /= 1.2;
            }
            
            // Omezení minimálního a maximálního přiblížení (1x až 6x)
            scale = Math.min(Math.max(1, scale), 6);

            if (scale === 1) {
                pointX = 0;
                pointY = 0;
            } else {
                pointX = e.offsetX - xs * scale;
                pointY = e.offsetY - ys * scale;
            }

            setTransform();
        });

        // Začátek tažení myší (Pan)
        photoWrapper.addEventListener('mousedown', function(e) {
            if (scale === 1) return; // Pokud není přiblíženo, netaháme
            e.preventDefault();
            startX = e.offsetX - pointX;
            startY = e.offsetY - pointY;
            isPanning = true;
        });

        // Pohyb při tažení myší
        window.addEventListener('mousemove', function(e) {
            if (!isPanning) return;
            
            // Musíme spočítat pozici vůči rámečku
            const rect = photoWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            pointX = x - startX;
            pointY = y - startY;
            setTransform();
        });

        // Konec tažení myší
        window.addEventListener('mouseup', function() {
            isPanning = false;
        });

        function resetZoom() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            setTransform();
        }
    </script>

</body>
</html>
