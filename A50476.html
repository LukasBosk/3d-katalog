<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail: Bronzová ataše</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; color: #333; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; font-weight: bold; }
        .back-link:hover { color: #000; }
        
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Levá strana: Média */
        .media-section { flex: 1 1 500px; display: flex; flex-direction: column; gap: 15px; }
        .model-box { background: #e9e9e9; height: 450px; border-radius: 6px; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; }
        
        /* Galerie náhledů */
        .gallery { display: flex; gap: 10px; }
        .gallery-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
        .gallery-thumb:hover { border-color: #999; }

        /* Hlavní zobrazení fotky */
        .photo-wrapper { display: none; width: 100%; height: 450px; background: #000; border-radius: 6px; overflow: hidden; position: relative; cursor: zoom-in; }
        .main-photo-view { width: 100%; height: 100%; object-fit: contain; }
        .zoom-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; pointer-events: none; }

        /* NOVÉ: Vyskakovací okno na celou obrazovku pro opravdový MAXI ZOOM */
        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            cursor: zoom-out;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .lightbox-overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            color: white; font-size: 30px; font-weight: bold;
            cursor: pointer; background: rgba(0,0,0,0.5);
            width: 45px; height: 45px; display: flex;
            align-items: center; justify-content: center; border-radius: 50%;
        }

        /* Pravá strana: Informace */
        .info-section { flex: 1 1 400px; }
        h1 { margin-top: 0; font-size: 26px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td { padding: 12px 0; border-bottom: 1px solid #eee; }
        td.label { font-weight: bold; color: #666; width: 40%; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Zpět do katalogu</a>

    <div class="container">
        
        <div class="media-section">
            
            <div class="model-box" id="modelBox">
                <model-viewer 
                    id="atašeModel"
                    src="A50476-web-glb.glb" 
                    alt="Bronzová ataše"
                    camera-controls 
                    auto-rotate 
                    environment-image="neutral"
                    exposure="1.5"
                    shadow-intensity="0">
                </model-viewer>
            </div>

            <div id="photoWrapper" class="photo-wrapper" onclick="openLightbox()">
                <img src="" id="mainPhoto" class="main-photo-view" alt="Detailní foto">
                <div class="zoom-hint">🔍 Klikněte pro přiblížení</div>
            </div>

            <div class="gallery">
                <div class="gallery-thumb" onclick="show3D()" style="background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-transform: uppercase;">3D</div>
                <img src="A50476-jpeg.jpg" class="gallery-thumb" onclick="changeMedia('A50476-jpeg.jpg')" alt="Náhled 1">
            </div>
            <p style="margin: 0; font-size: 12px; color: #888;">Kliknutím na "3D" se vrátíte k interaktivnímu modelu.</p>
        </div>

        <div class="info-section">
            <h1>Bronzová ataše</h1>
            <table>
                <tr><td class="label">Období</td><td>Doba římská</td></tr>
                <tr><td class="label">Lokalita</td><td>Boskovicko</td></tr>
                <tr><td class="label">Inv. č.</td><td>A50476</td></tr>
                <tr><td class="label">Materiál</td><td>Bronz</td></tr>
            </table>
        </div>

    </div>

    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightboxImg" src="" alt="Zvětšený detail" onmousemove="zoomImage(event)" onmouseleave="resetZoom()">
    </div>

    <script>
        // 1. OTOČENÍ MODELU: Hned po načtení ho skript otočí
        const model = document.getElementById('atašeModel');
        model.addEventListener('load', () => {
            model.orientation = "0deg 180deg 0deg";
        });

        // 2. PŘEPÍNÁNÍ MEZI 3D A FOTKAMI
        const modelBox = document.getElementById('modelBox');
        const photoWrapper = document.getElementById('photoWrapper');
        const mainPhoto = document.getElementById('mainPhoto');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        function changeMedia(photoUrl) {
            modelBox.style.display = 'none';
            photoWrapper.style.display = 'block'; 
            mainPhoto.src = photoUrl;
        }

        function show3D() {
            photoWrapper.style.display = 'none';
            modelBox.style.display = 'block';
        }

        // 3. NOVÝ LOKÁLNÍ ZOOM (Funguje i bez serveru)
        function openLightbox() {
            if(!mainPhoto.src) return;
            lightboxImg.src = mainPhoto.src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            resetZoom();
        }

        // Efekt lupy: Obrázek se zvětší a posouvá se podle pohybu myši
        function zoomImage(event) {
            const img = lightboxImg;
            img.style.transform = "scale(2.5)"; // Tímto číslem určíte sílu zvětšení (2.5x)
            
            // Výpočet pozice myši vůči obrázku
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;
            
            img.style.transformOrigin = `${xPercent}% ${yPercent}%`;
        }

        function resetZoom() {
            lightboxImg.style.transform = "scale(1)";
        }
    </script>

</body>
</html>
